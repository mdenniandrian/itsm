services:
  itsm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itsm_enterprise_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "ITSM Enterprise"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: itsm-mysql
      DB_PORT: 3306
      DB_DATABASE: itsm_db
      DB_USERNAME: itsm_user
      DB_PASSWORD: itsm_password_secret
    volumes:
      - itsm_storage:/var/www/html/storage
      - itsm_database:/var/www/html/database
    depends_on:
      itsm-mysql:
        condition: service_healthy

  itsm-mysql:
    image: mysql:8.0
    container_name: itsm_enterprise_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: itsm_db
      MYSQL_USER: itsm_user
      MYSQL_PASSWORD: itsm_password_secret
      MYSQL_ROOT_PASSWORD: root_password_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s

volumes:
  itsm_storage:
  itsm_database:
  mysql_data:
