# ==============================================================================
# ITSM ENTERPRISE - NGINX VIRTUAL HOST CONFIGURATION TEMPLATE
# ==============================================================================
# Installation path on Ubuntu/Debian: /etc/nginx/sites-available/itsm.conf
# Enable site: ln -s /etc/nginx/sites-available/itsm.conf /etc/nginx/sites-enabled/
# Test config: nginx -t && systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name itsm.yourcompany.com; # Replace with your domain or VPS IP

    # Redirect HTTP to HTTPS (Uncomment after obtaining SSL certificate)
    # return 301 https://$host$request_uri;

    root /var/www/itsm/laravel/public; # Adjust to your actual folder path
    index index.html index.php;

    charset utf-8;

    # Maximum file upload size (matches 50MB for ticket attachments & branding logos)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression for Ultra-Fast Loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    
    location = /robots.txt  { 
        access_log off; 
        log_not_found off; 
    }

    error_page 404 /index.php;

    # PHP-FPM Handler (PHP 8.3+)
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Adjust PHP version if using php8.4-fpm
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden dotfiles (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static assets long-term caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# ==============================================================================
# HTTPS (SSL) CONFIGURATION WITH CERTBOT
# ==============================================================================
# To automatically issue a free Let's Encrypt SSL certificate, run:
#   sudo certbot --nginx -d itsm.yourcompany.com
# ==============================================================================
